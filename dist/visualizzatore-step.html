<!doctype html>
<html lang="it" data-tema="scuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- versione a file unico: generata da build.mjs -->
<title>Visualizzatore STEP — geometria e dati</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231d2027'/%3E%3Cpath d='M16 4 27 10v12L16 28 5 22V10z' fill='none' stroke='%234c9aff' stroke-width='2'/%3E%3Cpath d='M5 10l11 6 11-6M16 16v12' fill='none' stroke='%234c9aff' stroke-width='1.4' opacity='.75'/%3E%3C/svg%3E">
<style>
:root {
  --sfondo: #16181d;
  --sfondo-2: #1d2027;
  --sfondo-3: #23262f;
  --bordo: #333845;
  --testo: #e8eaf0;
  --testo-tenue: #9aa1b1;
  --accento: #4c9aff;
  --accento-2: #ffa033;
  --ok: #4ec08a;
  --attenzione: #e8c45c;
  --errore: #ef6f6f;
  --ombra: 0 4px 18px rgba(0, 0, 0, 0.35);
  --raggio: 7px;
  color-scheme: dark;
}

:root[data-tema="chiaro"] {
  --sfondo: #eef0f4;
  --sfondo-2: #f7f8fa;
  --sfondo-3: #ffffff;
  --bordo: #cdd2dc;
  --testo: #1a1d24;
  --testo-tenue: #5c6373;
  --accento: #1667d6;
  --accento-2: #c3660d;
  --ok: #157f52;
  --attenzione: #8a6a08;
  --errore: #bb2d2d;
  --ombra: 0 4px 14px rgba(20, 24, 35, 0.12);
  color-scheme: light;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--sfondo);
  color: var(--testo);
  font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

body { display: flex; flex-direction: column; }
body.trascinamento::after {
  content: "rilascia qui il file STEP";
  position: fixed;
  inset: 12px;
  border: 2px dashed var(--accento);
  border-radius: 14px;
  display: grid;
  place-items: center;
  font-size: 20px;
  background: rgba(76, 154, 255, 0.10);
  pointer-events: none;
  z-index: 50;
}

/* ------------------------------------------------------------- barra alta */

.barra-alta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: var(--sfondo-2);
  border-bottom: 1px solid var(--bordo);
}

.marchio { font-size: 15px; letter-spacing: 0.2px; }
.marchio strong { color: var(--accento); }

.nome-file {
  color: var(--testo-tenue);
  max-width: 260px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.gruppo {
  display: flex;
  align-items: center;
  gap: 5px;
  padding-left: 10px;
  border-left: 1px solid var(--bordo);
}

.gruppo > label { color: var(--testo-tenue); font-size: 12px; }
.gruppo label input { vertical-align: -1px; }

button, select, input[type="search"] {
  font: inherit;
  color: var(--testo);
  background: var(--sfondo-3);
  border: 1px solid var(--bordo);
  border-radius: var(--raggio);
  padding: 4px 8px;
  cursor: pointer;
}

button:hover, select:hover { border-color: var(--accento); }
button.principale { background: var(--accento); border-color: var(--accento); color: #fff; font-weight: 600; }
button.mini { padding: 2px 6px; font-size: 11px; }
button.link {
  background: none;
  border: none;
  color: var(--accento);
  padding: 0;
  text-align: left;
  text-decoration: underline;
  text-underline-offset: 2px;
}

input[type="range"] { width: 110px; accent-color: var(--accento); cursor: pointer; }

/* --------------------------------------------------------------- layout */

main { flex: 1; display: flex; min-height: 0; }

.laterale {
  width: 430px;
  min-width: 300px;
  max-width: 50vw;
  display: flex;
  flex-direction: column;
  background: var(--sfondo-2);
  border-right: 1px solid var(--bordo);
  resize: horizontal;
  overflow: auto;
}

.schede { display: flex; gap: 2px; padding: 6px; border-bottom: 1px solid var(--bordo); flex-wrap: wrap; }
.scheda { border-radius: var(--raggio) var(--raggio) 0 0; background: transparent; border-color: transparent; color: var(--testo-tenue); }
.scheda.attiva { background: var(--sfondo-3); border-color: var(--bordo); color: var(--testo); font-weight: 600; }

.pannello { flex: 1; overflow: auto; padding: 10px 12px 28px; }

.area-vista { position: relative; flex: 1; min-width: 0; }
#vista { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.dettaglio-box {
  position: absolute;
  right: 12px;
  top: 12px;
  width: 310px;
  max-height: 62%;
  overflow: auto;
  padding: 8px 10px;
  background: color-mix(in srgb, var(--sfondo-2) 88%, transparent);
  border: 1px solid var(--bordo);
  border-radius: var(--raggio);
  box-shadow: var(--ombra);
  backdrop-filter: blur(4px);
}

.dettaglio-box h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--testo-tenue); }

.misura-info {
  position: absolute;
  left: 12px;
  top: 12px;
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 6px 10px;
  background: color-mix(in srgb, var(--sfondo-2) 90%, transparent);
  border: 1px solid var(--accento-2);
  border-radius: var(--raggio);
}

.misura-valore { font-weight: 600; color: var(--accento-2); }

/* l'attributo hidden deve prevalere sui display espliciti */
[hidden] { display: none !important; }

.aiuto {
  position: absolute;
  left: 12px;
  bottom: 10px;
  color: var(--testo-tenue);
  font-size: 11.5px;
  pointer-events: none;
}

/* ------------------------------------------------------------ contenuti */

.pannello-sezione { margin-bottom: 18px; }
.pannello-sezione h3 {
  margin: 0 0 6px;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  color: var(--testo-tenue);
  border-bottom: 1px solid var(--bordo);
  padding-bottom: 4px;
}

.tabella { width: 100%; border-collapse: collapse; font-size: 12px; }
.tabella th {
  text-align: left;
  font-weight: 600;
  color: var(--testo-tenue);
  padding: 3px 6px 3px 0;
  border-bottom: 1px solid var(--bordo);
  white-space: nowrap;
}
.tabella td { padding: 3px 6px 3px 0; border-bottom: 1px solid color-mix(in srgb, var(--bordo) 45%, transparent); vertical-align: top; }
.tabella tr:hover td { background: color-mix(in srgb, var(--accento) 8%, transparent); }
.tabella.compatta td:first-child { width: 42%; }
.chiave { color: var(--testo-tenue); }

.albero { max-height: 280px; overflow: auto; }
.albero-riga { display: flex; gap: 6px; align-items: center; padding: 2px 4px; cursor: pointer; border-radius: 4px; }
.albero-riga:hover { background: color-mix(in srgb, var(--accento) 12%, transparent); }
.albero-nome { font-weight: 500; }

.badge {
  font-size: 10.5px;
  padding: 0 5px;
  border-radius: 9px;
  background: color-mix(in srgb, var(--accento) 22%, transparent);
  color: var(--testo);
}
.badge.tenue { background: color-mix(in srgb, var(--testo-tenue) 22%, transparent); }

.riga-bottoni { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 6px; }
.riga-ricerca { display: flex; gap: 6px; margin-bottom: 8px; }
.ricerca { flex: 1; cursor: text; }

.codice {
  margin: 0 0 6px;
  padding: 8px;
  background: var(--sfondo-3);
  border: 1px solid var(--bordo);
  border-radius: var(--raggio);
  font: 11.5px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  white-space: pre-wrap;
  word-break: break-all;
  max-height: 220px;
  overflow: auto;
}

.elenco { margin: 0; padding-left: 18px; color: var(--attenzione); }
.elenco li { margin-bottom: 3px; }
.vuoto, .vuoto-overlay { color: var(--testo-tenue); font-style: italic; }
.nota { color: var(--testo-tenue); font-size: 11.5px; margin: 6px 0 0; }

/* --------------------------------------------------------- barra stato */

.barra-stato {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 5px 12px;
  background: var(--sfondo-2);
  border-top: 1px solid var(--bordo);
  font-size: 12px;
  min-height: 30px;
}

.stato-messaggio.ok { color: var(--ok); }
.stato-messaggio.attenzione { color: var(--attenzione); }
.stato-messaggio.errore { color: var(--errore); }
.barra-stato .dati { color: var(--testo-tenue); margin-left: auto; }

.progresso { width: 160px; height: 6px; background: var(--sfondo-3); border-radius: 3px; overflow: hidden; }
.progresso .riempimento { height: 100%; width: 0; background: var(--accento); transition: width 0.12s linear; }

@media (max-width: 950px) {
  main { flex-direction: column; }
  .laterale { width: auto; max-width: none; height: 45vh; border-right: none; border-bottom: 1px solid var(--bordo); }
  .dettaglio-box { position: static; width: auto; margin: 8px; max-height: none; }
}

</style>

<body>
<header class="barra-alta">
  <div class="marchio">Visualizzatore <strong>STEP</strong></div>
  <button id="bottone-apri" class="principale">Apri file…</button>
  <input id="file-input" type="file" accept=".stp,.step,.STP,.STEP,.p21,.ifc" hidden>
  <span id="nome-file" class="nome-file">nessun file</span>

  <div class="gruppo">
    <label>vista</label>
    <button data-vista="iso" title="isometrica (0)">iso</button>
    <button data-vista="fronte" title="fronte (1)">fr</button>
    <button data-vista="retro" title="retro (2)">re</button>
    <button data-vista="sinistra" title="sinistra (3)">sx</button>

<main>
  <aside class="laterale">
    <nav class="schede">

<footer class="barra-stato">

  <span id="barra-stato-dati" class="dati"></span>
  <div id="barra-progresso" class="progresso" hidden><div class="riempimento"></div></div>
</footer>

<script type="module">

// caricatore minimo: i moduli restano scritti come moduli ES
const __registro = {};
function __definisci(nome, corpo) { __registro[nome] = { corpo, esporta: null }; }
function __richiedi(nome) {
  const m = __registro[nome];
  if (!m) throw new Error('modulo mancante: ' + nome);
  if (!m.esporta) { m.esporta = {}; m.corpo(m.esporta, __richiedi); }
  return m.esporta;
}
globalThis.__VISUALIZZATORE_FILE_UNICO = true;

__definisci('src/ui/app.js', (esporta, __richiedi) => {
/**
 * Applicazione: carica i file STEP, mostra il modello 3D e tutti i dati
 * ricavati dal file. Nessuna dipendenza esterna.
 */

const { OrbitCamera } = __richiedi('src/viewer/camera.js');
const { PALETTE, Renderer } = __richiedi('src/viewer/renderer.js');
const { pick } = __richiedi('src/viewer/picking.js');
const { dettaglioSelezione, h, pannelloDati, pannelloDiagnostica, pannelloEntita, pannelloGeometria, pannelloStruttura } = __richiedi('src/ui/panels.js');
const { entitaCSV, esportaOBJ, esportaSTL, facceCSV, partiCSV, reportJSON, scarica } = __richiedi('src/ui/exporters.js');

const $ = (sel) => document.querySelector(sel);

const stato = {
  model: null,
  nomeFile: '',
  schedaAttiva: 'struttura',
  parteSelezionata: -1,
  facciaSelezionata: -1,
  selezione: null,
  ricercaEntita: '',
  risultatiEntita: null,
  entitaAperta: null,
  misura: { attiva: false, punti: [] },
  tolleranza: 0.1,
  tema: 'scuro',
};

let renderer;
let camera;
let worker = null;
let fallbackModuli = null;
let needsRender = true;

/* --------------------------------------------------------------- utilita' */

function log(messaggio, tipo = 'info') {
  const el = $('#stato-messaggio');
  el.textContent = messaggio;
  el.className = 'stato-messaggio ' + tipo;
}

function progresso(frazione, etichetta) {
  const barra = $('#barra-progresso');
  barra.hidden = frazione >= 1;
  barra.querySelector('.riempimento').style.width = `${Math.round(frazione * 100)}%`;
  if (etichetta) log(`${etichetta}… ${Math.round(frazione * 100)}%`);
}

const fmtNum = (v, d = 2) =>
  typeof v === 'number' ? v.toLocaleString('it-IT', { minimumFractionDigits: d, maximumFractionDigits: d }) : '—';

/* ---------------------------------------------------------------- worker */

function avviaWorker() {
  // nella versione a file unico (apertura con doppio clic) i worker non sono
  // disponibili: si elabora direttamente nella pagina
  if (globalThis.__VISUALIZZATORE_FILE_UNICO) {
    worker = null;
    return;
  }
  try {
    worker = new Worker(new URL('../worker/stepWorker.js', import.meta.url), { type: 'module' });
    worker.onmessage = (ev) => gestisciMessaggio(ev.data);
    worker.onerror = () => {
      worker = null;
      log('Worker non disponibile: elaborazione nella pagina principale.', 'attenzione');
    };
  } catch {
    worker = null; // ambiente senza worker: si elabora nella pagina
  }
}

/** Elaborazione senza worker (per ambienti che non li supportano). */
async function elaboraInPagina(text, nome, tolleranza) {
  if (!fallbackModuli) {
    const [parser, model] = await Promise.all([
      Promise.resolve(__richiedi('src/step/parser.js')),
      Promise.resolve(__richiedi('src/step/model.js')),
    ]);
    fallbackModuli = { parser, model };
  }
  const file = fallbackModuli.parser.parseStep(text, (f, l) => progresso(f * 0.35, l));
  const m = fallbackModuli.model.buildModel(file, {
    tolerance: tolleranza,
    onProgress: (f, l) => progresso(0.35 + f * 0.65, l),
  });
  m.nomeFileCaricato = nome;
  fallbackModuli.file = file;
  fallbackModuli.valueToText = fallbackModuli.parser.valueToText;
  gestisciMessaggio({ type: 'model', model: m });
}

function gestisciMessaggio(msg) {
  if (!msg) return;
  if (msg.type === 'progress') {
    progresso(msg.frazione, msg.etichetta);
    return;
  }
  if (msg.type === 'error') {
    progresso(1, '');
    log('Errore: ' + msg.messaggio, 'errore');
    return;
  }
  if (msg.type === 'model') {
    progresso(1, '');
    caricaModello(msg.model);
    return;
  }
  if (msg.type === 'entity') {
    stato.entitaAperta = msg.data;
    aggiornaPannelli();
    return;
  }
  if (msg.type === 'search') {
    stato.risultatiEntita = msg.risultati;
    stato.ricercaEntita = msg.query;
    aggiornaPannelli();
  }
}

/* ------------------------------------------------------- caricamento file */

function apriFile(file) {
  stato.nomeFile = file.name;
  $('#nome-file').textContent = file.name;
  log(`lettura di ${file.name}…`);
  progresso(0.01, 'apertura');
  const reader = new FileReader();
  reader.onload = () => {
    const text = String(reader.result || '');
    if (worker) {
      worker.postMessage({ type: 'load', text, nome: file.name, tolleranza: stato.tolleranza });
    } else {
      elaboraInPagina(text, file.name, stato.tolleranza).catch((err) =>
        log('Errore: ' + err.message, 'errore'));
    }
  };
  reader.onerror = () => log('Impossibile leggere il file.', 'errore');
  // i file STEP sono ASCII/Latin-1: evita caratteri sostitutivi sugli accenti
  reader.readAsText(file, 'windows-1252');
}

function caricaModello(model) {
  stato.model = model;
  stato.parteSelezionata = -1;
  stato.facciaSelezionata = -1;
  stato.selezione = null;
  stato.misura.punti = [];
  model.parti.forEach((p, i) => {
    p.visibile = true;
    if (!p.colore) p.colore = PALETTE[i % PALETTE.length];
  });
  renderer.setParts(model.parti);
  renderer.selezione = -1;
  const bb = model.bbox;
  camera.fit(bb, renderer.canvas.clientWidth / Math.max(1, renderer.canvas.clientHeight));
  $('#sezione-posizione').min = '-1';
  $('#sezione-posizione').max = '1';
  impostaSezione();
  aggiornaPannelli();
  aggiornaBarraStato();
  needsRender = true;
  const n = model.parti.length;
  log(`${stato.nomeFile}: ${model.statistiche.entita.toLocaleString('it-IT')} entità, ${n} part${n === 1 ? 'e' : 'i'}, ${model.statistiche.triangoli.toLocaleString('it-IT')} triangoli`, 'ok');
  if (!model.parti.length) log('Nessuna geometria solida trovata: il file contiene solo dati.', 'attenzione');
}

/* ---------------------------------------------------------------- pannelli */

const azioni = {
  selezionaParte(i) {
    stato.parteSelezionata = i;
    stato.facciaSelezionata = -1;
    renderer.selezione = -1;
    stato.selezione = { parte: i, faccia: -1, punto: stato.model.parti[i].centroide };
    aggiornaPannelli();
    needsRender = true;
  },
  selezionaNodo(n) {
    const ids = new Set(n.items.map((i) => i.item.id));
    const idx = stato.model.parti.findIndex((p) => ids.has(p.id));
    if (idx >= 0) azioni.selezionaParte(idx);
  },
  selezionaFaccia(parte, faccia) {
    stato.parteSelezionata = parte;
    stato.facciaSelezionata = faccia;
    renderer.selezione = faccia;
    const p = stato.model.parti[parte];
    stato.selezione = { parte, faccia, punto: p.centroide };
    aggiornaPannelli();
    needsRender = true;
  },
  visibilita(i, visibile) {
    stato.model.parti[i].visibile = visibile;
    renderer.setVisibilita(i, visibile);
    needsRender = true;
  },
  isola(i) {
    stato.model.parti.forEach((p, k) => {
      p.visibile = k === i;
      renderer.setVisibilita(k, k === i);
    });
    aggiornaPannelli();
    needsRender = true;
  },
  tuttoVisibile(v) {
    stato.model.parti.forEach((p, k) => {
      p.visibile = v;
      renderer.setVisibilita(k, v);
    });
    aggiornaPannelli();
    needsRender = true;
  },
  cercaEntita(query) {
    if (worker) worker.postMessage({ type: 'search', query });
    else cercaInPagina({ query });
  },
  cercaTipo(tipo) {

/** Ricerca entità senza worker. */
function cercaInPagina({ query, tipo, id }) {
  const f = fallbackModuli && fallbackModuli.file;
  if (!f) return;
  const testo = (ent) => {
    const part = (t, p) => `${t}(${p.map(fallbackModuli.valueToText).join(',')})`;
    return ent.complex
      ? `#${ent.id}=(${ent.complex.map((p) => part(p.type, p.params)).join('')});`
      : `#${ent.id}=${part(ent.type, ent.params)};`;
  };
  if (id != null) {
    const ent = f.entities.get(id);
    if (!ent) return;
    const refs = [];
    const walk = (v) => {
      if (v == null) return;
      if (Array.isArray(v)) v.forEach(walk);
      else if (typeof v === 'object') {
        if ('ref' in v) refs.push(v.ref);
        else if ('typed' in v) walk(v.value);
      }
    };
    walk(ent.complex ? ent.complex.map((p) => p.params) : ent.params);
    gestisciMessaggio({
      type: 'entity',
      data: {
        id: ent.id,
        tipi: ent.types,
        testo: testo(ent),
        riferimenti: [...new Set(refs)],
        citataDa: f.referrers(ent.id).map((e) => e.id),
      },
    });
    return;
  }
  const q = String(tipo || query || '').trim().toUpperCase();
  const risultati = [];
  if (/^#?\d+$/.test(q)) {
    const ent = f.entities.get(Number(q.replace('#', '')));
    if (ent) risultati.push({ id: ent.id, tipi: ent.types, testo: testo(ent) });
  } else {
    for (const ent of f.entities.values()) {
      if (risultati.length >= 200) break;
      if (ent.types.some((t) => t.includes(q)) || testo(ent).toUpperCase().includes(q)) {
        risultati.push({ id: ent.id, tipi: ent.types, testo: testo(ent).slice(0, 400) });
      }
    }
  }
  gestisciMessaggio({ type: 'search', risultati, query: q });
}

/** Volume con indicazione dell'attendibilità (mesh a tenuta o no). */
function volumeTesto(p) {

  if (p.volumeEsatto) return fmt(p.volume, 1);
  if (p.volumeAffidabile) return '≈ ' + fmt(p.volume, 1);
  return h('span', { title: `mesh con ${p.bordiAperti} bordi aperti` }, 'n.d.');

const fmt = (v, dec = 2) => {
  if (v == null || v === '' || Number.isNaN(v)) return '—';
  if (typeof v !== 'number') return String(v);
  if (v !== 0 && Math.abs(v) < 1e-3) return v.toExponential(2);
  return v.toLocaleString('it-IT', { minimumFractionDigits: dec, maximumFractionDigits: dec });

const vec = (v, dec = 2) => (Array.isArray(v) ? v.map((x) => fmt(x, dec)).join('  ') : '—');

function sezione(titolo, ...contenuto) {
  return h('section.pannello-sezione', h('h3', titolo), ...contenuto);
}

function tabella(intestazioni, righe, opts = {}) {
  const t = h('table.tabella' + (opts.compatta ? '.compatta' : ''));
  if (intestazioni) {
    t.appendChild(h('thead', h('tr', ...intestazioni.map((x) => h('th', x)))));
  }
  const tb = h('tbody');
  for (const r of righe) {
    const tr = h('tr', ...r.map((c) => h('td', c)));
    if (opts.onRowClick) {
      tr.classList.add('cliccabile');
      tr.onclick = () => opts.onRowClick(r);
    }
    tb.appendChild(tr);
  }
  t.appendChild(tb);
  return t;
}

function coppie(righe) {
  return tabella(null, righe.filter((r) => r[1] !== '' && r[1] != null).map(([k, v]) => [h('span.chiave', k), v]), {

      out.push('    outer loop');

    });
    out.push({
      id: p.id,
      codice: str(pp[0]),
      nome: str(pp[1]),
      descrizione: str(pp[2]),
      categorie: [...new Set(categorie)],
      contesti: [...new Set(contesti.filter(Boolean))],
    });
  }
  return out;
}

/* ----------------------------------------------- rappresentazioni di forma */

/** SHAPE_REPRESENTATION collegate a una PRODUCT_DEFINITION. */
function shapeRepsOf(file, pdEnt) {
  const reps = [];
  for (const pds of file.referrers(pdEnt.id)) {
    if (!pds.has('PRODUCT_DEFINITION_SHAPE')) continue;
    for (const sdr of file.referrers(pds.id)) {
      if (!sdr.has('SHAPE_DEFINITION_REPRESENTATION') && !sdr.has('PROPERTY_DEFINITION_REPRESENTATION')) continue;
      const p = sdr.partParams('SHAPE_DEFINITION_REPRESENTATION') ||
        sdr.partParams('PROPERTY_DEFINITION_REPRESENTATION') || sdr.params;
      const rep = file.get(p[1]);
      if (rep) reps.push(rep);
    }
  }
  return reps;
}

/** Segue SHAPE_REPRESENTATION_RELATIONSHIP per raggiungere la geometria. */
function relatedReps(file, rep, seen = new Set()) {
  if (!rep || seen.has(rep.id)) return [];
  seen.add(rep.id);
  const out = [rep];
  for (const rel of file.referrers(rep.id)) {
    if (!rel.has('REPRESENTATION_RELATIONSHIP') && !rel.has('SHAPE_REPRESENTATION_RELATIONSHIP')) continue;
    const p = rel.partParams('REPRESENTATION_RELATIONSHIP') || rel.params;
    const rep1 = file.get(p[2]);
    const rep2 = file.get(p[3]);
    // relazione senza trasformazione: stessa collocazione, segui l'altro lato
    const hasTransform = rel.has('REPRESENTATION_RELATIONSHIP_WITH_TRANSFORMATION');
    if (hasTransform) continue;
    for (const other of [rep1, rep2]) {
      if (other && other.id !== rep.id) out.push(...relatedReps(file, other, seen));
    }
  }
  return out;
}

/** Elementi geometrici (solidi, shell, facce, insiemi di curve) di una rappresentazione. */
function repItems(file, rep) {
  const p = rep.partParams('SHAPE_REPRESENTATION') ||
    rep.partParams('ADVANCED_BREP_SHAPE_REPRESENTATION') ||
    rep.partParams('MANIFOLD_SURFACE_SHAPE_REPRESENTATION') ||
    rep.partParams('GEOMETRICALLY_BOUNDED_WIREFRAME_SHAPE_REPRESENTATION') ||
    rep.partParams('REPRESENTATION') || rep.params;
  return file.getAll(p[1]);
}

const SOLID_LIKE = [
  'MANIFOLD_SOLID_BREP',
  'BREP_WITH_VOIDS',
  'SHELL_BASED_SURFACE_MODEL',
  'FACE_BASED_SURFACE_MODEL',
  'CLOSED_SHELL',
  'OPEN_SHELL',
  'ADVANCED_FACE',
  'FACE_SURFACE',
];

/* -------------------------------------------------------- albero assieme */

/** Matrice di una ITEM_DEFINED_TRANSFORMATION (da figlio a padre). */
function transformMatrix(file, idtEnt) {
  if (!idtEnt) return identity();
  const p = idtEnt.partParams('ITEM_DEFINED_TRANSFORMATION') || idtEnt.params;
  const parent = readPlacement(file, p[2]);
  const child = readPlacement(file, p[3]);
  // porta le coordinate del figlio nel sistema del padre
  return multiply(parent, invertRigid(child));
}

/** Trasformazione associata a una occorrenza (NEXT_ASSEMBLY_USAGE_OCCURRENCE). */
function occurrenceTransform(file, nauoEnt) {
  for (const pds of file.referrers(nauoEnt.id)) {
    if (!pds.has('PRODUCT_DEFINITION_SHAPE') && !pds.has('PROPERTY_DEFINITION')) continue;
    for (const cdsr of file.referrers(pds.id)) {
      if (!cdsr.has('CONTEXT_DEPENDENT_SHAPE_REPRESENTATION')) continue;
      const p = cdsr.partParams('CONTEXT_DEPENDENT_SHAPE_REPRESENTATION') || cdsr.params;
      const rel = file.get(p[1]);
      if (!rel) continue;
      const rp = rel.partParams('REPRESENTATION_RELATIONSHIP_WITH_TRANSFORMATION');
      if (rp) {
        const trRef = Array.isArray(rp[0]) ? rp[0][0] : rp[0];
        const idt = file.get(trRef);
        if (idt) return transformMatrix(file, idt);
      }
    }
  }
  return identity();
}

/**
 * Costruisce l'albero di assieme.
 * Ogni nodo: { nome, prodotto, definizione, matrice, figli[], items[] }
 */
function readAssembly(file) {
  const occurrences = [
    ...file.ofType('NEXT_ASSEMBLY_USAGE_OCCURRENCE'),
    ...file.ofType('ASSEMBLY_COMPONENT_USAGE'),
  ];
  const childIds = new Set();
  const byParent = new Map();
  for (const occ of occurrences) {
    const p = occ.partParams('NEXT_ASSEMBLY_USAGE_OCCURRENCE') ||
      occ.partParams('ASSEMBLY_COMPONENT_USAGE') || occ.params;
    const parent = file.get(p[3]);
    const child = file.get(p[4]);
    if (!parent || !child) continue;
    childIds.add(child.id);
    if (!byParent.has(parent.id)) byParent.set(parent.id, []);
    byParent.get(parent.id).push({
      occ,
      child,
      nome: str(p[0]) || str(p[1]),
      matrice: occurrenceTransform(file, occ),
    });
  }

  const pds = file.ofType('PRODUCT_DEFINITION');
  const roots = pds.filter((pd) => !childIds.has(pd.id));

  const build = (pdEnt, nome, matrice, depth, path, seen) => {
    const prod = productOf(file, pdEnt);
    const nomeProdotto = prod?.product
      ? str((prod.product.partParams('PRODUCT') || prod.product.params)[1]) ||
        str((prod.product.partParams('PRODUCT') || prod.product.params)[0])
      : '';
    const node = {
      id: pdEnt.id,
      nome: nome || nomeProdotto || `#${pdEnt.id}`,
      prodotto: nomeProdotto,
      versione: prod?.versione || '',
      matrice,
      percorso: [...path, nome || nomeProdotto || `#${pdEnt.id}`],
      figli: [],
      items: [],
    };
    // geometria propria
    for (const rep of shapeRepsOf(file, pdEnt)) {
      for (const r of relatedReps(file, rep)) {
        for (const item of repItems(file, r)) {
          if (SOLID_LIKE.some((t) => item.has(t)) || item.has('GEOMETRIC_CURVE_SET') || item.has('GEOMETRIC_SET')) {
            node.items.push({ item, rappresentazione: r.id, nomeRappresentazione: str((r.params || [])[0]) });
          }
        }
      }
    }
    if (depth < 32) {
      for (const link of byParent.get(pdEnt.id) || []) {
        if (seen.has(link.child.id)) continue;
        const childSeen = new Set(seen);
        childSeen.add(link.child.id);
        node.figli.push(
          build(link.child, link.nome, multiply(matrice, link.matrice), depth + 1, node.percorso, childSeen),
        );
      }
    }
    return node;
  };

  return roots.map((r) => build(r, '', identity(), 0, [], new Set([r.id])));
}

/* ------------------------------------------------------------- presentazione */

const PREDEFINED_COLORS = {
  red: [1, 0, 0], green: [0, 1, 0], blue: [0, 0, 1], yellow: [1, 1, 0],
  magenta: [1, 0, 1], cyan: [0, 1, 1], black: [0, 0, 0], white: [1, 1, 1],
};

/** Colori per elemento geometrico, da STYLED_ITEM / COLOUR_RGB. */
function readColors(file) {
  const map = new Map();
  const findColor = (ent, depth = 0) => {
    if (!ent || depth > 8) return null;
    if (ent.has('COLOUR_RGB')) {
      const p = ent.partParams('COLOUR_RGB') || ent.params;
      return [Number(p[1]) || 0, Number(p[2]) || 0, Number(p[3]) || 0];
    }
    if (ent.has('DRAUGHTING_PRE_DEFINED_COLOUR')) {
      const nome = str((ent.partParams('DRAUGHTING_PRE_DEFINED_COLOUR') || ent.params)[0]).toLowerCase();
      return PREDEFINED_COLORS[nome] || null;
    }
    const walk = (v) => {
      if (v == null) return null;
      if (Array.isArray(v)) {
        for (const x of v) {
          const c = walk(x);
          if (c) return c;
        }
        return null;
      }
      if (typeof v === 'object' && 'ref' in v) return findColor(file.get(v), depth + 1);
      if (typeof v === 'object' && 'typed' in v) return walk(v.value);
      return null;
    };
    const parts = ent.complex ? ent.complex.map((p) => p.params) : [ent.params];
    for (const params of parts) {
      const c = walk(params);
      if (c) return c;
    }
    return null;
  };

  for (const si of file.ofType('STYLED_ITEM')) {
    const p = si.partParams('STYLED_ITEM') || si.params;
    const item = file.get(p[2]);
    if (!item) continue;
    const colore = findColor(si);
    if (colore) map.set(item.id, colore);
  }
  return map;
}

/** Livelli di presentazione (PRESENTATION_LAYER_ASSIGNMENT). */
function readLayers(file) {
  const out = [];
  for (const l of file.ofType('PRESENTATION_LAYER_ASSIGNMENT')) {
    const p = l.partParams('PRESENTATION_LAYER_ASSIGNMENT') || l.params;
    out.push({
      nome: str(p[0]),
      descrizione: str(p[1]),
      elementi: (p[2] || []).map((r) => (r && r.ref) || null).filter(Boolean),
    });
  }
  return out;
}

/* --------------------------------------------- persone, date, approvazioni */

function readPersonOrg(file, ent) {
  if (!ent) return null;
  const p = ent.partParams('PERSON_AND_ORGANIZATION') || ent.params;
  const person = file.get(p[0]);
  const org = file.get(p[1]);
  const pp = person ? person.partParams('PERSON') || person.params : [];
  const op = org ? org.partParams('ORGANIZATION') || org.params : [];
  const nome = [str(pp[2]), str(pp[1])].filter(Boolean).join(' ').trim();
  return {
    persona: nome || str(pp[1]) || str(pp[0]) || '',
    organizzazione: str(op[1]) || str(op[0]) || '',
    descrizioneOrg: str(op[2]) || '',
  };
}

function readDateTime(file, ent) {
  if (!ent) return '';
  if (ent.has('DATE_AND_TIME')) {
    const p = ent.partParams('DATE_AND_TIME') || ent.params;
    const d = file.get(p[0]);
    const t = file.get(p[1]);
    const dp = d ? d.partParams('CALENDAR_DATE') || d.params : [];
    const tp = t ? t.partParams('LOCAL_TIME') || t.params : [];
    const pad = (n) => String(Math.round(Number(n) || 0)).padStart(2, '0');
    // CALENDAR_DATE eredita year_component da `date`: ordine (anno, giorno, mese)
    if (dp.length >= 3) {
      const data = `${dp[0]}-${pad(dp[2])}-${pad(dp[1])}`;
      const ora = tp.length ? ` ${pad(tp[0])}:${pad(tp[1])}:${pad(tp[2] || 0)}` : '';
      return data + ora;
    }
  }
  if (ent.has('CALENDAR_DATE')) {
    const p = ent.partParams('CALENDAR_DATE') || ent.params;
    const pad = (n) => String(Math.round(Number(n) || 0)).padStart(2, '0');
    return `${p[0]}-${pad(p[2])}-${pad(p[1])}`;
  }
  return '';
}

function readOrganizational(file) {
  const persone = [];
  for (const a of file.ofType('PERSON_AND_ORGANIZATION')) {
    const info = readPersonOrg(file, a);
    if (!info) continue;
    const ruoli = new Set();
    for (const ass of file.referrers(a.id)) {
      const p = ass.params;
      const role = file.get(p[1]);
      if (role && (role.has('PERSON_AND_ORGANIZATION_ROLE') || role.has('APPROVAL_ROLE'))) {
        ruoli.add(str((role.partParams('PERSON_AND_ORGANIZATION_ROLE') || role.params)[0]));
      }
    }
    persone.push({ ...info, ruoli: [...ruoli].filter(Boolean) });
  }

  const approvazioni = file.ofType('APPROVAL').map((a) => {
    const p = a.partParams('APPROVAL') || a.params;
    const status = file.get(p[0]);
    const dt = file
      .referrers(a.id)
      .find((e) => e.has('APPROVAL_DATE_TIME'));
    return {
      stato: status ? str((status.partParams('APPROVAL_STATUS') || status.params)[0]) : '',
      livello: str(p[1]),
      data: dt ? readDateTime(file, file.get((dt.partParams('APPROVAL_DATE_TIME') || dt.params)[0])) : '',
    };
  });

  const date = [];
  for (const a of file.ofType('DATE_AND_TIME')) {
    const usi = file.referrers(a.id).filter((e) => e.types.some((t) => t.includes('DATE_AND_TIME_ASSIGNMENT')));
    const ruoli = new Set();
    for (const u of usi) {
      const role = file.get((u.params || [])[1]);
      if (role) ruoli.add(str((role.partParams('DATE_TIME_ROLE') || role.params)[0]));
    }
    date.push({ valore: readDateTime(file, a), ruoli: [...ruoli].filter(Boolean) });
  }

  const sicurezza = file.ofType('SECURITY_CLASSIFICATION').map((s) => {
    const p = s.partParams('SECURITY_CLASSIFICATION') || s.params;
    const lvl = file.get(p[2]);
    return {
      nome: str(p[0]),
      scopo: str(p[1]),
      livello: lvl ? str((lvl.partParams('SECURITY_CLASSIFICATION_LEVEL') || lvl.params)[0]) : '',
    };
  });

  // i file esportati ripetono spesso le stesse righe per ogni prodotto:
  // raggruppa gli identici indicando quante volte compaiono
  const raggruppa = (righe) => {
    const map = new Map();
    for (const r of righe) {
      const chiave = JSON.stringify(r);
      const found = map.get(chiave);
      if (found) found.occorrenze++;
      else map.set(chiave, { ...r, occorrenze: 1 });
    }
    return [...map.values()];
  };

  return {
    persone: raggruppa(persone),
    approvazioni: raggruppa(approvazioni),
    date: raggruppa(date),
    sicurezza: raggruppa(sicurezza),
  };
}

/* ------------------------------------------------------------- proprieta' */

function readProperties(file) {
  const out = [];
  const consumati = new Set(); // elementi già usati come valore di una proprietà

  // PROPERTY_DEFINITION -> PROPERTY_DEFINITION_REPRESENTATION -> valore
  for (const pd of file.ofType('PROPERTY_DEFINITION')) {
    const p = pd.partParams('PROPERTY_DEFINITION') || pd.params;
    const nome = str(p[0]);
    let valore = str(p[1]);
    for (const pdr of file.referrers(pd.id)) {
      if (!pdr.has('PROPERTY_DEFINITION_REPRESENTATION')) continue;
      const rep = file.get((pdr.partParams('PROPERTY_DEFINITION_REPRESENTATION') || pdr.params)[1]);
      if (!rep) continue;
      for (const item of repItems(file, rep)) {
        consumati.add(item.id);
        const ip = item.params;
        const v = numOf(ip[1]);
        const testo = v != null ? String(v) : str(ip[1]);
        if (testo) valore = testo;
      }
    }
    if (nome || valore) out.push({ nome: nome || `#${pd.id}`, valore, fonte: `#${pd.id}` });
  }

  // proprietà generali (spesso solo il nome, con il valore altrove)
  for (const g of file.ofType('GENERAL_PROPERTY')) {
    const p = g.partParams('GENERAL_PROPERTY') || g.params;
    const nome = str(p[1]) || str(p[0]);
    const valore = str(p[2]);
    if (!nome) continue;
    const esistente = out.find((r) => r.nome === nome);
    if (esistente) {
      if (!esistente.valore && valore) esistente.valore = valore;
      continue;
    }
    out.push({ nome, valore, fonte: `#${g.id}` });
  }

  // testo libero non già associato a una proprietà
  for (const d of file.ofType('DESCRIPTIVE_REPRESENTATION_ITEM')) {
    if (consumati.has(d.id)) continue;
    const p = d.partParams('DESCRIPTIVE_REPRESENTATION_ITEM') || d.params;
    let nome = str(p[0]);
    if (!nome) {
      const rep = file.referrers(d.id).find((e) => e.has('REPRESENTATION'));
      if (rep) nome = str((rep.partParams('REPRESENTATION') || rep.params)[0]);
    }
    out.push({ nome: nome || 'descrizione', valore: str(p[1]), fonte: `#${d.id}` });
  }

  return out;
}

/* ------------------------------------------------------- geometria: solidi */

function bboxOf(positions) {
  const min = [Infinity, Infinity, Infinity];
  const max = [-Infinity, -Infinity, -Infinity];
  for (let i = 0; i < positions.length; i += 3) {
    for (let k = 0; k < 3; k++) {
      if (positions[i + k] < min[k]) min[k] = positions[i + k];
      if (positions[i + k] > max[k]) max[k] = positions[i + k];
    }
  }
  if (!Number.isFinite(min[0])) return { min: [0, 0, 0], max: [0, 0, 0], size: [0, 0, 0] };
  return { min, max, size: [max[0] - min[0], max[1] - min[1], max[2] - min[2]] };
}

/** Spigoli unici delle facce, campionati per il disegno del wireframe. */
function collectEdgePolylines(file, faces, tol) {
  const seen = new Set();
  const out = [];
  for (const face of faces) {
    const fp = face.partParams('ADVANCED_FACE') || face.partParams('FACE_SURFACE') || face.params;
    for (const bref of fp[1] || []) {
      const bound = file.get(bref);
      if (!bound) continue;
      const loop = file.get((bound.partParams('FACE_OUTER_BOUND') || bound.partParams('FACE_BOUND') || bound.params)[1]);
      if (!loop) continue;
      const lp = loop.partParams('EDGE_LOOP') || loop.params;
      for (const oref of lp[1] || []) {
        const oe = file.get(oref);
        if (!oe) continue;
        const edge = file.get((oe.partParams('ORIENTED_EDGE') || oe.params)[3]);
        if (!edge || seen.has(edge.id)) continue;
        seen.add(edge.id);
        const ep = edge.partParams('EDGE_CURVE') || edge.params;
        const curve = buildCurve(file, ep[3]);
        if (!curve) continue;
        const vp = (v) => {
          const ent = file.get(v);
          return ent ? readPoint(file, (ent.partParams('VERTEX_POINT') || ent.params)[1]) : null;
        };
        const ps = vp(ep[1]);
        const pe = vp(ep[2]);
        let t0 = curve.domain[0];
        let t1 = curve.domain[1];
        const closed = ps && pe ? dist(ps, pe) < 1e-9 : false;
        if (!closed && ps && pe && curve.invert) {
          t0 = curve.invert(ps);
          t1 = curve.invert(pe);
          if (curve.periodic && t1 <= t0) t1 += curve.periodic;
          else if (!curve.periodic && t1 < t0) [t0, t1] = [t1, t0];
        } else if (closed && curve.periodic) {
          t0 = ps && curve.invert ? curve.invert(ps) : curve.domain[0];
          t1 = t0 + curve.periodic;
        }
        const pts = sampleCurve(curve, t0, t1, tol).map((t) => curve.eval(t));
        if (pts.length >= 2) out.push({ id: edge.id, tipo: curve.type, punti: pts });
      }
    }
  }
  return out;
}

/** Curve di un GEOMETRIC_CURVE_SET (file wireframe). */
function collectSetCurves(file, itemEnt, tol) {
  const p = itemEnt.partParams('GEOMETRIC_CURVE_SET') || itemEnt.partParams('GEOMETRIC_SET') || itemEnt.params;
  const out = [];
  for (const ref of p[1] || []) {
    const curve = buildCurve(file, ref);
    if (!curve) continue;
    const pts = sampleCurve(curve, curve.domain[0], curve.domain[1], tol).map((t) => curve.eval(t));
    if (pts.length >= 2) out.push({ id: (ref && ref.ref) || 0, tipo: curve.type, punti: pts });
  }
  return out;
}

/**
 * Tassella un elemento geometrico, restituendo mesh, spigoli e misure.
 */
function buildPartGeometry(file, itemEnt, opts = {}) {
  const tol = opts.tolerance ?? 0.1;
  const maxDepth = opts.maxDepth ?? 3;
  const diagnostics = [];
  const faces = collectFaces(file, itemEnt);

  // Prima passata: ogni faccia nella propria mesh, per poter uniformare dopo
  // il livello di suddivisione (necessario per una mesh a tenuta: le facce
  // adiacenti devono suddividere lo spigolo comune allo stesso modo).
  const perFaccia = faces.map((face) => {
    const mesh = new MeshBuilder();
    const r = tessellateFace(file, face, mesh, { tolerance: tol, maxDepth });
    return { face, mesh, r };
  });
  const livelloMax = perFaccia.reduce((m, x) => Math.max(m, x.r.livello || 0), 0);
  for (const voce of perFaccia) {
    if ((voce.r.livello || 0) < livelloMax) {
      const mesh = new MeshBuilder();
      const r = tessellateFace(file, voce.face, mesh, {
        tolerance: tol,
        maxDepth,
        livelloForzato: livelloMax,
      });
      voce.mesh = mesh;
      voce.r = r;
    }
  }

  // unisce le mesh delle facce
  const finale = new MeshBuilder();
  const facce = [];
  let area = 0;
  for (const { face, mesh, r } of perFaccia) {
    const offset = finale.positions.length / 3;
    finale.positions.push(...mesh.positions);
    finale.normals.push(...mesh.normals);
    for (const i of mesh.indices) finale.indices.push(i + offset);
    finale.faceIds.push(...mesh.faceIds);
    area += r.area;
    facce.push({
      id: face.id,
      tipoSuperficie: r.surfaceType,
      infoSuperficie: r.surfaceInfo || null,
      triangoli: r.triangles,
      area: r.area,
    });
    if (r.problems.length) diagnostics.push(...r.problems);
  }

  const positions = new Float32Array(finale.positions);
  const normals = new Float32Array(finale.normals);
  const indices = new Uint32Array(finale.indices);

  const chiusa = itemEnt.has('MANIFOLD_SOLID_BREP') || itemEnt.has('CLOSED_SHELL') || itemEnt.has('BREP_WITH_VOIDS');
  const tenuta = contaBordiAperti(finale.positions, finale.indices, Math.max(tol * 0.05, 1e-5));

  let volume = meshVolume(finale.positions, finale.indices);
  let invertito = false;
  if (volume < 0 && faces.length) {
    // guscio orientato verso l'interno: raddrizza per avere normali uscenti
    for (let t = 0; t < indices.length; t += 3) {
      const tmp = indices[t + 1];
      indices[t + 1] = indices[t + 2];
      indices[t + 2] = tmp;
    }
    for (let i = 0; i < normals.length; i++) normals[i] = -normals[i];
    volume = -volume;
    invertito = true;
    diagnostics.push(`#${itemEnt.id}: guscio orientato verso l'interno nel file, orientamento corretto`);
  }

  const bbox = bboxOf(finale.positions);
  const volumeBbox = bbox.size[0] * bbox.size[1] * bbox.size[2];
  const frazioneAperta = tenuta.totali ? tenuta.aperti / tenuta.totali : 1;
  const plausibile = volume > 0 && (volumeBbox <= 0 || volume <= volumeBbox * 1.02);
  // mesh a tenuta -> valore esatto entro la tolleranza; qualche bordo aperto
  // -> valore approssimato; mesh molto aperta o valore implausibile -> niente
  const volumeAffidabile = chiusa && plausibile && frazioneAperta < 0.05;
  const volumeEsatto = chiusa && plausibile && tenuta.aperti === 0;
  if (chiusa && !volumeEsatto) {
    diagnostics.push(
      `#${itemEnt.id}: mesh con ${tenuta.aperti} bordi aperti su ${tenuta.totali}` +

        if (typeof v === 'number') return v;
        if (v && typeof v === 'object' && 'typed' in v && typeof v.value === 'number') return v.value;
        if (v && typeof v === 'object' && 'ref' in v) {
          const pt = readPoint(file, v);
          if (pt && basis.invert) return basis.invert(pt);
        }
      }
      return fallback;
    };
    let t1 = readTrim(p[2], basis.domain[0]);
    let t2 = readTrim(p[3], basis.domain[1]);
    const senseAgreement = p[4] && p[4].enum ? p[4].enum === 'T' : true;
    if (!senseAgreement) {
      const tmp = t1;
      t1 = t2;
      t2 = tmp;
    }
    if (basis.periodic && t2 <= t1) t2 += basis.periodic;
    return {
      ...basis,
      type: 'TRIMMED_CURVE(' + basis.type + ')',
      entity: e,
      domain: [t1, t2],
      closed: false,
      info: { ...basis.info, taglio: [t1, t2] },
    };
  }

  if (t.includes('COMPOSITE_CURVE')) {
    const p = e.partParams('COMPOSITE_CURVE');
    const segs = (p[1] || [])
      .map((r) => {
        const seg = file.get(r);
        if (!seg) return null;
        const sp = seg.partParams('COMPOSITE_CURVE_SEGMENT') || seg.params;
        const c = buildCurve(file, sp[2]);
        if (!c) return null;
        const sameSense = sp[1] && sp[1].enum ? sp[1].enum === 'T' : true;
        return { curve: c, sameSense };
      })
      .filter(Boolean);
    if (!segs.length) return null;
    return {
      type: 'COMPOSITE_CURVE',
      entity: e,
      domain: [0, segs.length],
      closed: false,
      info: { segmenti: segs.length },
      eval: (u) => {
        const i = Math.min(segs.length - 1, Math.max(0, Math.floor(u)));
        const f = u - i;
        const s = segs[i];
        const [a, b] = s.curve.domain;
        const tt = s.sameSense ? a + (b - a) * f : b - (b - a) * f;
        return s.curve.eval(tt);
      },
      invert: null,
    };
  }

  if (t.includes('SURFACE_CURVE') || t.includes('SEAM_CURVE') || t.includes('INTERSECTION_CURVE')) {
    // usa la rappresentazione 3D (curve_3d), primo parametro
    const p = e.partParams('SURFACE_CURVE') || e.partParams('SEAM_CURVE') || e.partParams('INTERSECTION_CURVE');
    const basis = buildCurve(file, p[1]);
    if (basis) return { ...basis, type: basis.type, entity: e };
    return null;
  }

  return null;
}

/** Parametro della curva piu' vicino a `pt` (campionamento + raffinamento). */
function closestParam(curve, pt, samples = 64) {
  if (curve.invert && curve.type !== 'B_SPLINE_CURVE_WITH_KNOTS' && curve.type !== 'RATIONAL_B_SPLINE_CURVE') {
    return curve.invert(pt);
  }
  const [a, b] = curve.domain;
  let best = a;
  let bd = Infinity;
  for (let i = 0; i <= samples; i++) {
    const u = a + ((b - a) * i) / samples;
    const d = dist(curve.eval(u), pt);
    if (d < bd) {
      bd = d;
      best = u;
    }
  }
  let step = (b - a) / samples;
  for (let iter = 0; iter < 40 && step > 1e-12; iter++) {
    let improved = false;
    for (const s of [-step, step]) {
      const u = Math.min(b, Math.max(a, best + s));
      const d = dist(curve.eval(u), pt);
      if (d < bd) {
        bd = d;
        best = u;
        improved = true;
      }
    }
    if (!improved) step *= 0.5;
  }
  return best;
}

/* --------------------------------------------------------------- superfici */

/**
 * Costruisce una superficie valutabile.
 * @returns {{type:string, eval:(u:number,v:number)=>number[],
 *            normal:(u:number,v:number)=>number[],
 *            uPeriod:number|null, vPeriod:number|null,
 *            uRange:[number,number], vRange:[number,number],
 *            project:(p:number[])=>[number,number], info:object}|null}
 */
function buildSurface(file, ref) {
  const e = file.get(ref);
  if (!e) return null;
  const t = e.types;
  const TWO_PI = 2 * Math.PI;

  const withNormal = (s) => {
    if (!s.normal) {
      s.normal = (u, v) => {
        const h = 1e-6;
        const du = sub(s.eval(u + h, v), s.eval(u - h, v));
        const dv = sub(s.eval(u, v + h), s.eval(u, v - h));
        return normalize(cross(du, dv));
      };
    }
    s.entity = e;
    return s;
  };

  if (t.includes('PLANE')) {
    const p = e.partParams('PLANE');
    const m = readPlacement(file, p[1]);
    const inv = invertRigid(m);
    const n = normalize([m[8], m[9], m[10]]);
    return withNormal({
      type: 'PLANE',
      uPeriod: null,
      vPeriod: null,
      uRange: [-1e6, 1e6],
      vRange: [-1e6, 1e6],
      isPlanar: true,
      info: { origine: [m[12], m[13], m[14]], normale: n },
      eval: (u, v) => transformPoint(m, [u, v, 0]),
      normal: () => n,
      project: (pt) => {
        const l = transformPoint(inv, pt);
        return [l[0], l[1]];
      },
    });
  }

  if (t.includes('CYLINDRICAL_SURFACE')) {
    const p = e.partParams('CYLINDRICAL_SURFACE');
    const m = readPlacement(file, p[1]);
    const inv = invertRigid(m);
    const r = Number(p[2]) || 0;
    return withNormal({
      type: 'CYLINDRICAL_SURFACE',
      uPeriod: TWO_PI,
      vPeriod: null,
      uRange: [0, TWO_PI],
      vRange: [-1e6, 1e6],
      info: { raggio: r, asse: normalize([m[8], m[9], m[10]]), origine: [m[12], m[13], m[14]] },
      eval: (u, v) => transformPoint(m, [r * Math.cos(u), r * Math.sin(u), v]),
      normal: (u) => transformDir(m, [Math.cos(u), Math.sin(u), 0]),
      project: (pt) => {
        const l = transformPoint(inv, pt);
        let a = Math.atan2(l[1], l[0]);
        if (a < 0) a += TWO_PI;
        return [a, l[2]];
      },
    });
  }

  if (t.includes('CONICAL_SURFACE')) {
    const p = e.partParams('CONICAL_SURFACE');
    const m = readPlacement(file, p[1]);
    const inv = invertRigid(m);
    const r = Number(p[2]) || 0;
    const ang = Number(p[3]) || 0;
    const tan = Math.tan(ang);
    return withNormal({
      type: 'CONICAL_SURFACE',
      uPeriod: TWO_PI,
      vPeriod: null,
      uRange: [0, TWO_PI],
      vRange: [-1e6, 1e6],
      info: { raggio: r, semiangolo: ang, asse: normalize([m[8], m[9], m[10]]) },
      eval: (u, v) => {
        const rr = r + v * tan;
        return transformPoint(m, [rr * Math.cos(u), rr * Math.sin(u), v]);
      },
      project: (pt) => {
        const l = transformPoint(inv, pt);
        let a = Math.atan2(l[1], l[0]);
        if (a < 0) a += TWO_PI;
        return [a, l[2]];
      },
    });
  }

  if (t.includes('SPHERICAL_SURFACE')) {
    const p = e.partParams('SPHERICAL_SURFACE');
    const m = readPlacement(file, p[1]);
    const inv = invertRigid(m);
    const r = Number(p[2]) || 0;
    return withNormal({
      type: 'SPHERICAL_SURFACE',
      uPeriod: TWO_PI,
      vPeriod: null,
      uRange: [0, TWO_PI],
      vRange: [-Math.PI / 2, Math.PI / 2],
      info: { raggio: r, centro: [m[12], m[13], m[14]] },
      eval: (u, v) => transformPoint(m, [r * Math.cos(v) * Math.cos(u), r * Math.cos(v) * Math.sin(u), r * Math.sin(v)]),
      normal: (u, v) => transformDir(m, [Math.cos(v) * Math.cos(u), Math.cos(v) * Math.sin(u), Math.sin(v)]),
      project: (pt) => {
        const l = transformPoint(inv, pt);
        let a = Math.atan2(l[1], l[0]);
        if (a < 0) a += TWO_PI;
        const rr = Math.hypot(l[0], l[1]);
        return [a, Math.atan2(l[2], rr)];
      },
    });
  }

  if (t.includes('TOROIDAL_SURFACE') || t.includes('DEGENERATE_TOROIDAL_SURFACE')) {
    const p = e.partParams('TOROIDAL_SURFACE') || e.partParams('DEGENERATE_TOROIDAL_SURFACE');
    const m = readPlacement(file, p[1]);
    const inv = invertRigid(m);
    const R = Number(p[2]) || 0;
    const r = Number(p[3]) || 0;
    return withNormal({
      type: 'TOROIDAL_SURFACE',
      uPeriod: TWO_PI,
      vPeriod: TWO_PI,
      uRange: [0, TWO_PI],
      vRange: [0, TWO_PI],
      info: { raggioMaggiore: R, raggioMinore: r },
      eval: (u, v) => {
        const rr = R + r * Math.cos(v);
        return transformPoint(m, [rr * Math.cos(u), rr * Math.sin(u), r * Math.sin(v)]);
      },
      normal: (u, v) => transformDir(m, [Math.cos(v) * Math.cos(u), Math.cos(v) * Math.sin(u), Math.sin(v)]),
      project: (pt) => {
        const l = transformPoint(inv, pt);
        let a = Math.atan2(l[1], l[0]);
        if (a < 0) a += TWO_PI;
        const rr = Math.hypot(l[0], l[1]) - R;
        let b = Math.atan2(l[2], rr);
        if (b < 0) b += TWO_PI;
        return [a, b];
      },
    });
  }

  if (t.includes('B_SPLINE_SURFACE_WITH_KNOTS') || t.includes('BEZIER_SURFACE') || t.includes('B_SPLINE_SURFACE')) {
    const base = e.partParams('B_SPLINE_SURFACE_WITH_KNOTS') || e.partParams('B_SPLINE_SURFACE') || e.params;
    const du = Math.round(Number(base[1]) || 1);
    const dv = Math.round(Number(base[2]) || 1);
    const grid = base[3] || [];
    const pts = grid.map((row) => (row || []).map((r) => readPoint(file, r) || [0, 0, 0]));
    const nu = pts.length - 1;
    const nv = (pts[0] ? pts[0].length : 1) - 1;
    let uKnots;
    let vKnots;
    if (t.includes('B_SPLINE_SURFACE_WITH_KNOTS')) {
      uKnots = expandKnots(base[8] || [], base[10] || []);
      vKnots = expandKnots(base[9] || [], base[11] || []);
    } else {
      const clamped = (n, d) => {
        const k = [];
        for (let i = 0; i <= d; i++) k.push(0);
        for (let i = 1; i <= n - d; i++) k.push(i / (n - d + 1));
        for (let i = 0; i <= d; i++) k.push(1);
        return k;
      };
      uKnots = clamped(nu, du);
      vKnots = clamped(nv, dv);
    }
    let weights = null;
    const ratPart = e.partParams('RATIONAL_B_SPLINE_SURFACE');
    if (ratPart) weights = (ratPart[0] || []).map((row) => (row || []).map(Number));
    const uRange = [uKnots[du], uKnots[nu + 1]];
    const vRange = [vKnots[dv], vKnots[nv + 1]];

    const evalPt = (u, v) => {
      const uu = Math.min(Math.max(u, uRange[0]), uRange[1]);
      const vv = Math.min(Math.max(v, vRange[0]), vRange[1]);
      const su = findSpan(nu, du, uu, uKnots);
      const sv = findSpan(nv, dv, vv, vKnots);
      const bu = basisDerivatives(su, uu, du, uKnots, 0)[0];
      const bv = basisDerivatives(sv, vv, dv, vKnots, 0)[0];
      let x = 0;
      let y = 0;
      let z = 0;
      let w = 0;
      for (let i = 0; i <= du; i++) {
        const iu = su - du + i;
        const row = pts[iu] || [];
        for (let j = 0; j <= dv; j++) {
          const iv = sv - dv + j;
          const cp = row[iv] || [0, 0, 0];
          const wij = weights ? weights[iu]?.[iv] ?? 1 : 1;
          const b = bu[i] * bv[j] * wij;
          x += b * cp[0];
          y += b * cp[1];
          z += b * cp[2];
          w += b;
        }
      }
      return weights && Math.abs(w) > 1e-300 ? [x / w, y / w, z / w] : [x, y, z];
    };

    const surf = withNormal({
      type: t.includes('RATIONAL_B_SPLINE_SURFACE') ? 'RATIONAL_B_SPLINE_SURFACE' : 'B_SPLINE_SURFACE_WITH_KNOTS',
      uPeriod: null,
      vPeriod: null,
      uRange,
      vRange,
      info: {
        gradoU: du,
        gradoV: dv,
        puntiControllo: (nu + 1) * (nv + 1),
        grigliaControllo: `${nu + 1} x ${nv + 1}`,
        razionale: !!weights,
        dominioU: uRange,
        dominioV: vRange,
      },
      eval: evalPt,
    });
    surf.project = (pt) => projectNumeric(surf, pt);
    return surf;
  }

  if (t.includes('SURFACE_OF_LINEAR_EXTRUSION')) {
    const p = e.partParams('SURFACE_OF_LINEAR_EXTRUSION');
    const curve = buildCurve(file, p[1]);
    const dir = readVector(file, p[2]) || [0, 0, 1];
    if (!curve) return null;
    const surf = withNormal({
      type: 'SURFACE_OF_LINEAR_EXTRUSION',
      uPeriod: curve.periodic || null,
      vPeriod: null,
      uRange: curve.domain,
      vRange: [-1e4, 1e4],
      info: { curvaBase: curve.type, direzione: normalize(dir) },
      eval: (u, v) => add(curve.eval(u), scale(dir, v)),
    });
    surf.project = (pt) => projectNumeric(surf, pt, curve.domain, [-1e3, 1e3]);
    return surf;
  }

  if (t.includes('SURFACE_OF_REVOLUTION')) {
    const p = e.partParams('SURFACE_OF_REVOLUTION');
    const curve = buildCurve(file, p[1]);
    const axisEnt = file.get(p[2]);
    if (!curve || !axisEnt) return null;
    const ap = axisEnt.partParams('AXIS1_PLACEMENT') || axisEnt.params;
    const origin = readPoint(file, ap[1]) || [0, 0, 0];
    const axis = normalize(readDirection(file, ap[2]) || [0, 0, 1]);
    const rotate = (pt, ang) => {
      const rel = sub(pt, origin);
      const c = Math.cos(ang);
      const s = Math.sin(ang);
      const par = scale(axis, dot(rel, axis));
      const perp = sub(rel, par);
      const w = cross(axis, perp);
      return add(origin, add(par, add(scale(perp, c), scale(w, s))));
    };
    const surf = withNormal({
      type: 'SURFACE_OF_REVOLUTION',
      uPeriod: 2 * Math.PI,
      vPeriod: null,
      uRange: [0, 2 * Math.PI],
      vRange: curve.domain,
      info: { curvaBase: curve.type, asse: axis, origine: origin },
      eval: (u, v) => rotate(curve.eval(v), u),
    });
    surf.project = (pt) => projectNumeric(surf, pt, [0, 2 * Math.PI], curve.domain);
    return surf;
  }

  if (t.includes('OFFSET_SURFACE')) {
    const p = e.partParams('OFFSET_SURFACE');
    const basis = buildSurface(file, p[1]);
    const d = Number(p[2]) || 0;
    if (!basis) return null;
    const surf = withNormal({
      type: 'OFFSET_SURFACE',
      uPeriod: basis.uPeriod,
      vPeriod: basis.vPeriod,
      uRange: basis.uRange,
      vRange: basis.vRange,
      isPlanar: basis.isPlanar,
      info: { superficieBase: basis.type, distanza: d },
      eval: (u, v) => add(basis.eval(u, v), scale(basis.normal(u, v), d)),
      normal: (u, v) => basis.normal(u, v),
    });
    // la proiezione usa la superficie base: sufficiente per offset piccoli
    surf.project = (pt) => basis.project(sub(pt, scale(basis.normal(...basis.project(pt)), d)));
    return surf;
  }

  if (t.includes('CURVE_BOUNDED_SURFACE') || t.includes('RECTANGULAR_TRIMMED_SURFACE')) {
    const p = e.partParams('CURVE_BOUNDED_SURFACE') || e.partParams('RECTANGULAR_TRIMMED_SURFACE');
    const basis = buildSurface(file, p[1]);
    if (!basis) return null;
    if (t.includes('RECTANGULAR_TRIMMED_SURFACE')) {
      const u1 = Number(p[2]);
      const u2 = Number(p[3]);
      const v1 = Number(p[4]);
      const v2 = Number(p[5]);
      return { ...basis, uRange: [u1, u2], vRange: [v1, v2], entity: e };
    }
    return { ...basis, entity: e };
  }

  return null;
}

/**
 * Raffinamento locale (Gauss-Newton) del parametro (u,v) piu' vicino a `pt`,
 * partendo da `uv0`. Segue la superficie senza saltare su altri rami.
 * @returns {{uv:[number,number], residual:number}}
 */
function projectLocal(surf, pt, uv0, iters = 24) {
  const [u0, u1] = surf.uRange;
  const [v0, v1] = surf.vRange;
  const hu = Math.max((u1 - u0) * 1e-6, 1e-9);
  const hv = Math.max((v1 - v0) * 1e-6, 1e-9);
  let u = Math.min(Math.max(uv0[0], u0), u1);
  let v = Math.min(Math.max(uv0[1], v0), v1);
  let residual = dist(surf.eval(u, v), pt);
  for (let it = 0; it < iters; it++) {
    const p = surf.eval(u, v);
    const r = sub(pt, p);
    residual = len(r);
    if (residual < 1e-10) break;
    const Su = scale(sub(surf.eval(Math.min(u1, u + hu), v), surf.eval(Math.max(u0, u - hu), v)), 1 / (2 * hu));
    const Sv = scale(sub(surf.eval(u, Math.min(v1, v + hv)), surf.eval(u, Math.max(v0, v - hv))), 1 / (2 * hv));
    const a = dot(Su, Su);
    const b = dot(Su, Sv);
    const c = dot(Sv, Sv);
    const d1 = dot(r, Su);
    const d2 = dot(r, Sv);
    const det = a * c - b * b;
    let du;
    let dv;
    if (Math.abs(det) < 1e-300) {
      du = a > 1e-300 ? d1 / a : 0;
      dv = c > 1e-300 ? d2 / c : 0;
    } else {
      du = (c * d1 - b * d2) / det;
      dv = (a * d2 - b * d1) / det;
    }
    // passo limitato: evita salti fuori dal ramo corrente
    const maxU = (u1 - u0) * 0.25;
    const maxV = (v1 - v0) * 0.25;
    du = Math.max(-maxU, Math.min(maxU, du));
    dv = Math.max(-maxV, Math.min(maxV, dv));
    let step = 1;
    let improved = false;
    for (let k = 0; k < 6; k++) {
      const nu = Math.min(u1, Math.max(u0, u + du * step));
      const nv = Math.min(v1, Math.max(v0, v + dv * step));
      const nd = dist(surf.eval(nu, nv), pt);
      if (nd < residual) {
        u = nu;
        v = nv;
        residual = nd;
        improved = true;
        break;
      }
      step *= 0.4;
    }
    if (!improved) break;
  }
  return { uv: [u, v], residual };
}

/** Proiezione numerica globale: ricerca su griglia + raffinamento locale. */
function projectNumeric(surf, pt, uRangeOverride, vRangeOverride) {
  const [u0, u1] = uRangeOverride || surf.uRange;
  const [v0, v1] = vRangeOverride || surf.vRange;
  const N = 16;
  let bu = u0;
  let bv = v0;
  let bd = Infinity;
  for (let i = 0; i <= N; i++) {
    const u = u0 + ((u1 - u0) * i) / N;
    for (let j = 0; j <= N; j++) {
      const v = v0 + ((v1 - v0) * j) / N;
      const d = dist(surf.eval(u, v), pt);
      if (d < bd) {
        bd = d;
        bu = u;
        bv = v;
      }
    }
  }
  return projectLocal(surf, pt, [bu, bv]).uv;
}

/**
 * Proietta una sequenza di punti mantenendo la continuita': ogni punto parte
 * dal parametro del precedente, con ricaduta sulla ricerca globale se il
 * residuo resta alto. Indispensabile sulle superfici che si ripiegano.
 */
function projectSequence(surf, points, tol = 1e-4) {
  const out = [];
  let prev = null;
  for (const p of points) {
    let best = null;
    if (prev) {
      const r = projectLocal(surf, p, prev);
      if (r.residual <= tol) best = r.uv;
    }
    if (!best) {
      const guess = projectNumeric(surf, p);
      const r = projectLocal(surf, p, guess);
      best = r.uv;
    }
    out.push(best);
    prev = best;
  }
  return out;
}

/**
 * Fattori di scala che rendono lo spazio (u,v) approssimativamente isometrico:
 * mediana di |dS/du| e |dS/dv| sul dominio. Serve a evitare parametrizzazioni
 * estremamente anisotrope, che rovinerebbero la triangolazione 2D.
 */
function metricScales(surf, samples = 7) {
  const clampRange = ([a, b]) => {
    if (!Number.isFinite(a) || !Number.isFinite(b) || b <= a) return [0, 1];
    const span = b - a;
    return span > 1e5 ? [a + span * 0.4999, b - span * 0.4999] : [a, b];
  };
  const [u0, u1] = clampRange(surf.uRange);
  const [v0, v1] = clampRange(surf.vRange);
  const hu = (u1 - u0) * 1e-4 || 1e-6;
  const hv = (v1 - v0) * 1e-4 || 1e-6;
  const du = [];
  const dv = [];
  for (let i = 0; i < samples; i++) {
    const u = u0 + ((u1 - u0) * i) / (samples - 1);
    for (let j = 0; j < samples; j++) {
      const v = v0 + ((v1 - v0) * j) / (samples - 1);
      const p = surf.eval(u, v);
      du.push(dist(surf.eval(Math.min(u1, u + hu), v), p) / hu);
      dv.push(dist(surf.eval(u, Math.min(v1, v + hv)), p) / hv);
    }
  }
  const median = (arr) => {
    const a = arr.filter((x) => Number.isFinite(x) && x > 0).sort((x, y) => x - y);
    return a.length ? a[Math.floor(a.length / 2)] : 1;
  };
  return [median(du), median(dv)];
}

/**
 * Riparametrizza una superficie moltiplicando i parametri per i fattori dati:
 * il risultato si usa come una superficie qualsiasi, ma con (u,v) in unita'
 * di lunghezza approssimata.
 */
function scaledSurface(surf, su, sv) {
  if (!(su > 0) || !(sv > 0) || (Math.abs(su - 1) < 1e-9 && Math.abs(sv - 1) < 1e-9)) return surf;
  return {
    type: surf.type,
    entity: surf.entity,
    info: surf.info,
    isPlanar: surf.isPlanar,
    uPeriod: surf.uPeriod ? surf.uPeriod * su : null,
    vPeriod: surf.vPeriod ? surf.vPeriod * sv : null,

      continue;
    }
    const i0 = ia * 3;
    const i1 = ib * 3;
    const i2 = ic * 3;
    const a = [P[i0], P[i0 + 1], P[i0 + 2]];
    const b = [P[i1], P[i1 + 1], P[i1 + 2]];
    const c = [P[i2], P[i2 + 1], P[i2 + 2]];
    const gn = cross(sub(b, a), sub(c, a));
    if (len(gn) < 1e-14) continue; // triangolo degenere
    const vn = [
      (N[i0] + N[i1] + N[i2]) / 3,
      (N[i0 + 1] + N[i1 + 1] + N[i2 + 1]) / 3,
      (N[i0 + 2] + N[i1 + 2] + N[i2 + 2]) / 3,
    ];
    if (dot(gn, vn) < 0) keepIdx.push(ia, ic, ib);
    else keepIdx.push(ia, ib, ic);
    keepFace.push(mesh.faceIds[t]);
  }
  mesh.indices.length = 0;
  mesh.indices.push(...keepIdx);
  mesh.faceIds.length = 0;
  mesh.faceIds.push(...keepFace);
}

/**
 * Banda tra due anelli chiusi (cilindro, cono, estrusione): cuce direttamente
 * i punti campionati dai due bordi, cosi' la mesh combacia con le facce
 * adiacenti. Restituisce false se la faccia non ha questa forma.
 */
function tessellateLoft(surf, rings, tol, flip, mesh, faceId, livello = 0) {
  const rigato = ['CYLINDRICAL_SURFACE', 'CONICAL_SURFACE', 'SURFACE_OF_LINEAR_EXTRUSION'].includes(surf.type);
  if (!rigato || rings.length !== 2) return false;
  // densifica i bordi con gli stessi punti di mezzo delle facce suddivise:
  // le facce adiacenti devono avere vertici coincidenti
  const densifica = (punti) => {
    let out = punti;
    for (let l = 0; l < livello; l++) {
      const next = [];
      for (let i = 0; i < out.length; i++) {
        const a = out[i];
        const b = out[(i + 1) % out.length];
        next.push(a, [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2]);
      }
      out = next;
    }
    return out;
  };
  const anelli = rings.map((r0) => {
    const r = { ...r0, points: densifica(r0.points) };
    const uv = r.points.map((p) => surf.project(p));
    // srotola u per avere una sequenza monotona sul periodo
    const period = surf.uPeriod;
    if (period) {
      let wrap = 0;
      for (let i = 1; i < uv.length; i++) {
        let d = uv[i][0] + wrap - uv[i - 1][0];
        while (d > period / 2) { wrap -= period; d -= period; }
        while (d < -period / 2) { wrap += period; d += period; }
        uv[i][0] += wrap;
      }
    }
    const punti = r.points.map((p, i) => ({ p, u: uv[i][0], v: uv[i][1] }));
    // orientamento crescente in u
    if (punti.length > 1 && punti[punti.length - 1].u < punti[0].u) punti.reverse();
    return punti;
  });
  let [A, B] = anelli;
  if (A[0].v > B[0].v) [A, B] = [B, A];
  const period = surf.uPeriod || 0;
  // allinea l'inizio di B al primo u di A
  const ruota = (ring, uRif) => {
    let best = 0;
    let bd = Infinity;
    ring.forEach((pt, i) => {
      let d = Math.abs(((pt.u - uRif) % period + period * 1.5) % period - period * 0.5);
      if (!period) d = Math.abs(pt.u - uRif);
      if (d < bd) { bd = d; best = i; }
    });
    return ring.slice(best).concat(ring.slice(0, best));
  };
  if (period) {
    B = ruota(B, A[0].u);
    // dopo la rotazione i parametri u vanno risistemati crescenti,
    // altrimenti la cucitura si attorciglia
    for (let k = 1; k < B.length; k++) {
      while (B[k].u < B[k - 1].u) B[k].u += period;
    }
    while (B[0].u > A[0].u + period / 2) B.forEach((pt) => { pt.u -= period; });
    while (B[0].u < A[0].u - period / 2) B.forEach((pt) => { pt.u += period; });
  }

  const vert = (pt) => mesh.vertex(pt.p, surfaceNormalAt(surf, pt.u, pt.v, flip));
  const idxA = A.map(vert);
  const idxB = B.map(vert);
  // chiudi gli anelli
  idxA.push(idxA[0]);
  idxB.push(idxB[0]);
  const uA = A.map((p) => p.u).concat([A[0].u + (period || 0)]);
  const uB = B.map((p) => p.u).concat([B[0].u + (period || 0)]);
  let i = 0;
  let j = 0;
  let guard = 0;
  while ((i < idxA.length - 1 || j < idxB.length - 1) && guard++ < 100000) {
    const avanzaA = j >= idxB.length - 1 || (i < idxA.length - 1 && uA[i + 1] - uA[0] <= uB[j + 1] - uB[0]);
    if (avanzaA) {
      if (flip) mesh.triangle(idxA[i], idxB[j], idxA[i + 1], faceId);
      else mesh.triangle(idxA[i], idxA[i + 1], idxB[j], faceId);
      i++;
    } else {
      if (flip) mesh.triangle(idxA[i], idxB[j + 1], idxB[j], faceId);
      else mesh.triangle(idxA[i], idxB[j], idxB[j + 1], faceId);
      j++;
    }
  }
  return true;
}

/** Tassella una faccia periodica completa con una griglia sul periodo. */
function tessellateBand(surf, rings, tol, flip, mesh, faceId) {
  const uPeriod = surf.uPeriod;
  const vs = [];
  const us = [];
  for (const r of rings) {
    for (const p of r.points) {
      const [u, v] = surf.project(p);
      us.push(u);
      vs.push(v);
    }
  }
  let v0 = Math.min(...vs);
  let v1 = Math.max(...vs);
  if (!(v1 > v0)) {
    v1 = v0 + 1e-6;
  }
  const u0 = 0;
  const u1 = uPeriod || Math.max(...us) - Math.min(...us) || 1;
  // numero di suddivisioni dalla tolleranza
  const probe = (n, along) => {
    let maxErr = 0;
    for (let i = 0; i < n; i++) {
      const t0 = i / n;
      const t1 = (i + 1) / n;
      const pa = along(t0);
      const pb = along(t1);
      const pm = along((t0 + t1) / 2);
      const chord = [(pa[0] + pb[0]) / 2, (pa[1] + pb[1]) / 2, (pa[2] + pb[2]) / 2];
      maxErr = Math.max(maxErr, dist(chord, pm));
    }
    return maxErr;
  };
  let nu = 8;
  while (nu < 256 && probe(nu, (t) => surf.eval(u0 + (u1 - u0) * t, (v0 + v1) / 2)) > tol) nu *= 2;
  let nv = 2;
  while (nv < 128 && probe(nv, (t) => surf.eval((u0 + u1) / 2, v0 + (v1 - v0) * t)) > tol) nv *= 2;

  const grid = [];
  for (let i = 0; i <= nu; i++) {
    const u = u0 + ((u1 - u0) * i) / nu;
    const row = [];
    for (let j = 0; j <= nv; j++) {
      const v = v0 + ((v1 - v0) * j) / nv;
      row.push(mesh.vertex(surf.eval(u, v), surfaceNormalAt(surf, u, v, flip)));
    }
    grid.push(row);
  }
  let count = 0;
  for (let i = 0; i < nu; i++) {
    for (let j = 0; j < nv; j++) {
      const a = grid[i][j];
      const b = grid[i + 1][j];
      const c = grid[i + 1][j + 1];
      const d = grid[i][j + 1];
      if (flip) {
        mesh.triangle(a, c, b, faceId);
        mesh.triangle(a, d, c, faceId);
      } else {
        mesh.triangle(a, b, c, faceId);
        mesh.triangle(a, c, d, faceId);
      }
      count += 2;
    }
  }
  return count;
}

/**
 * Tassella una singola faccia aggiungendo i triangoli a `mesh`.
 * @returns {{triangles:number, area:number, surfaceType:string, problems:string[]}}
 */
function tessellateFace(file, faceEnt, mesh, opts = {}) {
  const tol = opts.tolerance ?? 0.05;
  const params = faceEnt.partParams('ADVANCED_FACE') || faceEnt.partParams('FACE_SURFACE') || faceEnt.params;
  const surfRef = params[2];
  const sameSense = params[3] && params[3].enum ? params[3].enum === 'T' : true;
  let surf = buildSurface(file, surfRef);
  const problems = [];
  if (!surf) {
    const se = file.get(surfRef);
    problems.push(`#${faceEnt.id}: superficie ${se ? se.types.join('+') : '?'} non supportata`);
    return { triangles: 0, area: 0, surfaceType: se ? se.types[0] : 'SCONOSCIUTA', problems };
  }
  const flip = !sameSense;
  // lavora in uno spazio parametrico ~isometrico: la triangolazione 2D e'
  // affidabile solo se u e v hanno scale comparabili alle lunghezze reali
  if (!surf.isPlanar) {
    const [su, sv] = metricScales(surf);
    surf = scaledSurface(surf, su, sv);
  }

  const { rings, problems: ringProblems } = faceRings(file, faceEnt, tol);
  problems.push(...ringProblems);
  if (!rings.length) {
    problems.push(`#${faceEnt.id}: nessun contorno utilizzabile`);
    return { triangles: 0, area: 0, surfaceType: surf.type, problems };
  }

  // proiezione + rilevamento cuciture
  const projected = rings.map((r) => ({ ...r, ...unwrapRing(surf, r.points, tol) }));
  const wrapsU = surf.uPeriod && projected.some((r) => Math.abs(r.netU) > surf.uPeriod * 0.5);
  const wrapsV = surf.vPeriod && projected.some((r) => Math.abs(r.netV) > surf.vPeriod * 0.5);

  const startTri = mesh.indices.length / 3;
  let livelloUsato = 0;

  if (wrapsU || wrapsV) {
    livelloUsato = opts.livelloForzato ?? 0;
    if (!tessellateLoft(surf, rings, tol, flip, mesh, faceEnt.id, livelloUsato)) {
      tessellateBand(surf, rings, tol, flip, mesh, faceEnt.id);
    }
  } else {
    // scegli il contorno esterno (area UV massima)
    let outerIdx = projected.findIndex((r) => r.isOuter);
    if (outerIdx < 0) {
      let best = -1;
      let bestA = -1;
      projected.forEach((r, i) => {
        const a = Math.abs(ringArea(r.uv));
        if (a > bestA) {
          bestA = a;
          best = i;
        }
      });
      outerIdx = best;
    }
    const outer = projected[outerIdx];
    const holes = projected.filter((_, i) => i !== outerIdx);
    let outerUV = outer.uv.slice();
    if (ringArea(outerUV) < 0) outerUV.reverse();
    const holeUVs = holes.map((h) => {
      const uv = h.uv.slice();
      if (ringArea(uv) > 0) uv.reverse();
      return uv;
    });
    const ring = holeUVs.length ? bridgeHoles(outerUV, holeUVs) : outerUV;
    const tris = earClip(ring);
    // i lati del contorno sono vincolati, gli altri si possono scambiare
    const constrained = new Set();
    for (let i = 0; i < ring.length; i++) constrained.add(edgeKey(i, (i + 1) % ring.length));
    delaunayFlips(ring, tris, constrained);
    const isPlanar = !!surf.isPlanar;
    // ogni vertice del contorno appartiene ai due segmenti di bordo adiacenti
    const nRing = ring.length;
    const verts = ring.map((uv, i) => ({
      uv,
      // sul contorno si usa il punto campionato dalla curva, non la
      // valutazione della superficie: identico per le facce adiacenti
      p: uv.p3 || surf.eval(uv[0], uv[1]),
      segs: [(i - 1 + nRing) % nRing, i],
    }));
    const cache = new Map();
    const emit = (vert) => {
      const key = vert.uv[0] + '|' + vert.uv[1];
      let id = cache.get(key);
      if (id === undefined) {
        id = mesh.vertex(vert.p, surfaceNormalAt(surf, vert.uv[0], vert.uv[1], flip));
        cache.set(key, id);
      }
      return id;
    };
    // livello di suddivisione dal massimo scostamento (l'errore scala ~ h^2)
    let level = 0;
    // il livello forzato vale anche per le facce piane: le facce adiacenti
    // devono suddividere lo spigolo comune lo stesso numero di volte,
    // altrimenti restano fessure (T-junction) tra le facce
    if (opts.livelloForzato != null) {
      level = opts.livelloForzato;
    } else if (!isPlanar) {
      let sag = 0;
      for (const [i0, i1, i2] of tris) {
        sag = Math.max(sag, triangleSag(surf, [verts[i0], verts[i1], verts[i2]]));
      }
      if (sag > tol) level = Math.ceil(Math.log2(sag / tol) / 2);
      const maxLevel = opts.maxDepth ?? 3;
      level = Math.min(level, maxLevel);
      // tetto ai triangoli per faccia
      const budget = opts.maxTrianglesPerFace ?? 60000;
      while (level > 0 && tris.length * 4 ** level > budget) level--;
    }
    livelloUsato = level;
    for (const [i0, i1, i2] of tris) {
      const parts = [];
      subdivideUniform(surf, [verts[i0], verts[i1], verts[i2]], level, parts);
      for (const t of parts) {
        const a = emit(t[0]);
        const b = emit(t[1]);
        const c = emit(t[2]);
        if (flip) mesh.triangle(a, c, b, faceEnt.id);
        else mesh.triangle(a, b, c, faceEnt.id);
      }
    }
  }

  // Coerenza: il verso dei triangoli deve concordare con le normali analitiche
  // della superficie (che tengono conto di same_sense). Rimuove anche i
  // triangoli degeneri.
  normalizeWinding(mesh, startTri);

  // area dei triangoli generati
  let area = 0;
  for (let t = startTri; t < mesh.indices.length / 3; t++) {
    const i0 = mesh.indices[t * 3] * 3;
    const i1 = mesh.indices[t * 3 + 1] * 3;
    const i2 = mesh.indices[t * 3 + 2] * 3;
    const P = mesh.positions;
    const a = [P[i0], P[i0 + 1], P[i0 + 2]];
    const b = [P[i1], P[i1 + 1], P[i1 + 2]];
    const c = [P[i2], P[i2 + 1], P[i2 + 2]];
    area += len(cross(sub(b, a), sub(c, a))) / 2;
  }

  return {
    triangles: mesh.indices.length / 3 - startTri,
    area,
    surfaceType: surf.type,
    surfaceInfo: surf.info,
    livello: livelloUsato,
    problems,
  };
}

/** Elenca le facce contenute in un item geometrico (solido, shell, faccia). */
function collectFaces(file, itemEnt, seen = new Set()) {
  if (!itemEnt || seen.has(itemEnt.id)) return [];
  seen.add(itemEnt.id);
  const t = itemEnt.types;
  const out = [];
  const push = (refs) => {
    for (const r of refs || []) {
      const e = file.get(r);
      if (e) out.push(...collectFaces(file, e, seen));
    }
  };
  if (FACE_TYPES.some((ft) => t.includes(ft))) {
    out.push(itemEnt);
    return out;
  }
  if (t.includes('MANIFOLD_SOLID_BREP') || t.includes('BREP_WITH_VOIDS')) {
    const p = itemEnt.partParams('MANIFOLD_SOLID_BREP') || itemEnt.params;
    const outerShell = file.get(p[1]);
    if (outerShell) out.push(...collectFaces(file, outerShell, seen));
    const voidsP = itemEnt.partParams('BREP_WITH_VOIDS');
    if (voidsP) push(voidsP[1] || voidsP[2]);
    return out;
  }
  if (t.includes('CLOSED_SHELL') || t.includes('OPEN_SHELL')) {
    const p = itemEnt.partParams('CLOSED_SHELL') || itemEnt.partParams('OPEN_SHELL') || itemEnt.params;
    push(p[1]);
    return out;
  }
  if (t.includes('ORIENTED_CLOSED_SHELL') || t.includes('ORIENTED_OPEN_SHELL')) {
    const p = itemEnt.params;
    const inner = file.get(p[2] ?? p[1]);
    if (inner) out.push(...collectFaces(file, inner, seen));
    return out;
  }
  if (t.includes('SHELL_BASED_SURFACE_MODEL')) {
    const p = itemEnt.partParams('SHELL_BASED_SURFACE_MODEL') || itemEnt.params;
    push(p[1]);
    return out;
  }
  if (t.includes('FACE_BASED_SURFACE_MODEL')) {
    const p = itemEnt.partParams('FACE_BASED_SURFACE_MODEL') || itemEnt.params;
    push(p[1]);
    return out;
  }
  if (t.includes('MANIFOLD_SURFACE_SHAPE_REPRESENTATION') || t.includes('SHAPE_REPRESENTATION')) {
    const p = itemEnt.partParams('SHAPE_REPRESENTATION') || itemEnt.params;
    push(p[1]);
    return out;
  }
  if (t.includes('GEOMETRIC_SET') || t.includes('GEOMETRIC_CURVE_SET')) {
    return out; // solo curve: gestite a parte come wireframe
  }
  return out;
}

/** Volume con segno della mesh (somma dei tetraedri) — chiuso => volume reale. */
function meshVolume(positions, indices) {
  let vol = 0;
  for (let t = 0; t < indices.length; t += 3) {
    const i0 = indices[t] * 3;
    const i1 = indices[t + 1] * 3;
    const i2 = indices[t + 2] * 3;
    const ax = positions[i0];
    const ay = positions[i0 + 1];
    const az = positions[i0 + 2];
    const bx = positions[i1];
    const by = positions[i1 + 1];
    const bz = positions[i1 + 2];
    const cx = positions[i2];
    const cy = positions[i2 + 1];
    const cz = positions[i2 + 2];
    vol += (ax * (by * cz - bz * cy) - ay * (bx * cz - bz * cx) + az * (bx * cy - by * cx)) / 6;
  }
  return vol;
}

/** Centroide approssimato (media pesata sulle aree dei triangoli). */
function meshCentroid(positions, indices) {
  let cx = 0;
  let cy = 0;
  let cz = 0;
  let wsum = 0;
  for (let t = 0; t < indices.length; t += 3) {
    const i0 = indices[t] * 3;
    const i1 = indices[t + 1] * 3;
    const i2 = indices[t + 2] * 3;
    const a = [positions[i0], positions[i0 + 1], positions[i0 + 2]];
    const b = [positions[i1], positions[i1 + 1], positions[i1 + 2]];
    const c = [positions[i2], positions[i2 + 1], positions[i2 + 2]];
    const w = len(cross(sub(b, a), sub(c, a))) / 2;
    cx += ((a[0] + b[0] + c[0]) / 3) * w;
    cy += ((a[1] + b[1] + c[1]) / 3) * w;
    cz += ((a[2] + b[2] + c[2]) / 3) * w;
    wsum += w;
  }
  return wsum > 0 ? [cx / wsum, cy / wsum, cz / wsum] : [0, 0, 0];
}



/**
 * Conta i lati di triangolo non condivisi da due triangoli: se e' zero la
 * mesh e' a tenuta e area/volume sono affidabili.
 */
function contaBordiAperti(positions, indices, tolleranza = 1e-4) {
  const q = (i) =>
    Math.round(positions[i] / tolleranza) + ',' +
    Math.round(positions[i + 1] / tolleranza) + ',' +
    Math.round(positions[i + 2] / tolleranza);
  const conta = new Map();
  for (let t = 0; t < indices.length; t += 3) {
    const v = [q(indices[t] * 3), q(indices[t + 1] * 3), q(indices[t + 2] * 3)];
    for (let k = 0; k < 3; k++) {
      const a = v[k];
      const b = v[(k + 1) % 3];
      const key = a < b ? a + '|' + b : b + '|' + a;
      conta.set(key, (conta.get(key) || 0) + 1);
    }
  }
  let aperti = 0;
  for (const c of conta.values()) if (c !== 2) aperti++;
  return { aperti, totali: conta.size };
}

Object.assign(esporta, { sampleCurve, faceRings, earClip, tessellateFace, collectFaces, meshVolume, meshCentroid, contaBordiAperti, MeshBuilder, FACE_TYPES });
});
